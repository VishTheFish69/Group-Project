<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Flappy Bird – Three.js</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: #000;
      font-family: system-ui, sans-serif;
    }
    #ui {
      position: absolute; top: 10px; left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.5);
      padding: 8px 10px;
      border-radius: 8px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    #flapBtn {
      position: absolute; bottom: 20px; right: 20px;
      z-index: 10;
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 999px;
      background: #ffcc00;
      font-weight: bold;
      border: none;
    }
    #message {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      color: white; font-size: 26px;
      text-shadow: 0 0 10px black;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="ui">
    <div id="score">Score: 0</div>

    <label>
      Difficulty:
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
        <option value="special">Special</option>
      </select>
    </label>

    <label>
      <input type="checkbox" id="modeSwitch">
      Full mode (textures/models)
    </label>
  </div>

  <button id="flapBtn">Flap</button>

  <div id="message"></div>

  <script type="module" src="script.js"></script>

</body>
</html>
